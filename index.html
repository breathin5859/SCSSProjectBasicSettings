<!doctype html>
<html lang="ko">
  <head>
    <title>파일리스트</title>
    <meta charset="utf-8" />
    <style type="text/css">
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        list-style: none;
        font-style: normal;
      }
      a {
        color: #4776d6;
        text-decoration: underline;
      }
      img {
        border: 0;
      }
      label,
      input {
        vertical-align: middle;
      }
      input {
        outline: none;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        border-spacing: 0;
      }
      caption {
        width: 100%;
        height: 30px;
      }
      body {
        padding: 0 20px;
        font-size: 16px;
        font-family: "Noto Sans KR", sans-serif;
      }
      p {
        line-height: 1.5;
      }

      table {
        border-bottom: 1px solid #f4f4f4;
        margin-bottom: 50px;
        border-top: 3px solid #d2d6de;
      }
      h1 {
        font-size: 2rem;
        font-weight: normal;
      }
      h2 {
        font-size: 1rem;
        font-weight: normal;
        margin-bottom: 20px;
      }
      hr {
        margin-bottom: 50px;
      }

      .wrapper {
        width: 100%;
        margin: auto;
      }

      .project-title {
        margin: 40px 0;
      }

      .list-header .list {
        padding: 0 0 50px 0;
        line-height: 30px;
      }

      table {
        tr {
          &.--check {
            background-color: #db425e20;
          }
          &:last-child {
            td {
              border-bottom: none;
            }
          }

          th,
          td {
            padding: 10px;
            font-size: 16px;
            text-align: center;
          }
          th {
            font-weight: normal;
            border-right: 1px solid #f4f4f4;
            border-bottom: 1px solid #f4f4f4;
            background-color: #fff;
            &:last-child {
              border-right: none;
            }
          }
          td {
            padding: 5px;
            font-size: 14px;
            border-bottom: 1px solid #f4f4f4;
            border-right: 1px solid #f4f4f4;
            color: #666;
            &:nth-child(2) {
              padding-left: 20px;
              text-align: left;
            }
            &:nth-child(3) {
              padding-left: 20px;
              text-align: left;
            }

            &:last-child {
              text-align: left;
            }

            &:last-child {
              border-right: none;
            }

            a {
              display: block;
              width: 100%;
              height: 100%;
            }
            &.category {
              position: relative;
              padding: 10px;
              text-align: left;
              font-size: 15px;
              font-weight: bold;
              background-color: #e4e3e3;
              color: #1d1e25;
              &:before {
                position: absolute;
                top: 0;
                left: 0;
                display: inline-block;
                width: 3px;
                height: 100%;
                background-color: #9a9ca1;
                content: "";
              }
            }
          }
        }
      }

      .top {
        display: flex;
        justify-content: space-between;
        ul {
          display: flex;
          margin-bottom: 50px;
        }
        li {
          display: flex;
          margin-right: 10px;
          line-height: 25px;
        }
      }

      .list-header .list {
        padding: 0 0 50px 0;
        line-height: 30px;
      }
      .state {
        display: inline-block;
        color: #fff;
        width: 25px;
        height: 25px;
        border-radius: 999px;
        line-height: 25px;
        text-align: center;
        &.r {
          padding-inline: 10px;
          background-color: #a55eea;
          width: max-content;
          &::before {
            content: "Responsive";
          }
        }
        &.w {
          background-color: #20bf6b;
          &::before {
            content: "W";
          }
        }
        &.m {
          background-color: #f7b731;
          &::before {
            content: "M";
          }
        }
        &.end {
          background-color: #db425e;
          font-weight: bold;
          &::before {
            content: "완";
          }
        }
        &.ing {
          background-color: #2d98da;
          font-weight: bold;
          &::before {
            content: "진";
          }
        }
        &.delete {
          background-color: #0b0b0b;
          color: #fff;
          font-weight: bold;
          &::before {
            content: "X";
          }
        }
        &.modify {
          padding: 0 5px;
          border-radius: 30px;
          font-weight: bold;
          background-color: #39c4cd;
          text-align: center;
          &::before {
            content: "수";
          }
        }
        span {
          font-size: 16px;
          color: #666;
        }
      }
      .t_em {
        color: #e10e0e;
      }
      .t_re {
        color: #046ac9;
      }
      .t_pu {
        color: #17ae03;
      }
      .t_lg {
        color: #c904b4;
      }

      .list.none a {
        text-decoration: line-through;
        color: #aeaeae;
        cursor: not-allowed;
      }
      #progress {
        overflow: hidden;
        float: left;
        display: block;
        width: 100%;
        height: 20px;
        margin-bottom: 5px;
        background: #eee;
        border-radius: 30px;
        em {
          display: block;
          height: 100%;
          background: #eb3b5a;
          border-radius: 30px;
        }
      }
      .status {
        width: 300px;
      }
      #finish {
        color: #1352a2;
      }
      #total {
        display: block;
      }
      .percent {
        display: block;
        float: right;
      }
    </style>
  </head>
  <body>
    <div class="pub-list wrappe">
      <header class="list-header">
        <div class="project-title">
          <span class="state r"></span>
          <h1 class="">프로젝트명</h1>
        </div>
        <div class="top clear">
          <ul>
            <li>상태 :</li>
            <li><span class="state end"></span></li>
            <li>완료</li>
            <li><span class="state ing"></span></li>
            <li>진행중&nbsp;&nbsp;&nbsp;/</li>
            <li><span class="state modify"></span></li>
            <li>수정</li>
          </ul>
          <div class="status">
            <span id="progress"><em></em></span> <span id="total"></span>
          </div>
        </div>
      </header>
      <div class="content">
        <table>
          <colgroup>
            <col width="5%" />
            <col width="30%" />
            <col width="20%" />
            <col width="10%" />
            <col width="5%" />
            <col />
          </colgroup>
          <thead>
            <tr>
              <th>No</th>
              <th>페이지</th>
              <th>파일</th>
              <th>완료일</th>
              <th>상태</th>
              <th>비고</th>
            </tr>
          </thead>
          <tbody id="fileListBody"></tbody>
        </table>
      </div>
    </div>
    <script>
      const groups = [
        //  스타일가이드
        {
          title: "Style",
          includeInProgress: false,
          pages: [
            {
              page: "스타일가이드",
              href: "./pages/style.html",
              fileName: "style.html",
              doneDate: "-",
              state: "",
              note: "",
            },
          ],
        },
        {
          title: "공통",
          pages: [
            {
              page: "파일명",
              href: "./pages/.html",
              fileName: ".html",
              doneDate: "2026.00.00",
              state: "",
              note: "",
            },
          ],
        },

        // Group
        {
          title: "파일명",
          pages: [
            {
              page: "파일명",
              href: "./pages/.html",
              fileName: ".html",
              doneDate: "2026.00.00",
              state: "",
              note: [{ text: "26.00.00 note" }],
              check: false,
            },
          ],
        },
      ];

      const tbody = document.querySelector("#fileListBody");
      const graphBar = document.querySelector("#progress em");
      const graphTotal = document.querySelector("#total");

      let noIndex = 0;

      //  진행률 계산 대상: 그룹이 포함(true)이고, 그 안의 page들을 펼쳐서(flat) 모음
      const progressTargets = groups
        .filter((group) => group.includeInProgress !== false)
        .flatMap((group) => group.pages);

      const total = progressTargets.length;

      const finish = progressTargets.filter(
        (item) => item.state === "end",
      ).length;

      const progress = total === 0 ? 0 : Math.floor((finish / total) * 100);

      graphBar.style.width = progress + "%";
      graphTotal.innerHTML = `
        ${finish} / ${total} page
        <span class="percent">진행률 ${progress}%</span>
      `;

      const createCategoryRow = (title) => {
        const tr = document.createElement("tr");
        const td = document.createElement("td");

        td.className = "category";
        td.colSpan = 6;
        td.textContent = title;

        tr.appendChild(td);

        return tr;
      };

      const createPageRow = (item, isProgressIncluded) => {
        const tr = document.createElement("tr");
        tr.className = "list";

        if (item.check === true) {
          tr.classList.add("--check");
        }

        if (!item.href) {
          tr.classList.add("none");
        }

        //  진행률 포함되는 그룹일 때만 No 증가
        if (isProgressIncluded) {
          noIndex += 1;
        }

        const noText = isProgressIncluded ? String(noIndex) : "";

        tr.innerHTML = `
              <td>${noText}</td>
              <td>${item.page ?? ""}</td>
              <td>
                ${
                  item.href
                    ? `<a href="${item.href}" target="_blank">${item.fileName ?? item.href}</a>`
                    : `<a href="javascript:void(0)" tabindex="-1">${item.fileName ?? ""}</a>`
                }
              </td>
              <td>${item.doneDate ?? ""}</td>
              <td><span class="state ${item.state ?? ""}"></span></td>
              <td class="note-cell"></td>
            `;

        const noteTd = tr.querySelector(".note-cell");

        const rawNote = item ? item.note : null;

        const noteLines = Array.isArray(rawNote)
          ? rawNote
          : typeof rawNote === "string" && rawNote.trim() !== ""
            ? [{ text: rawNote, className: "" }]
            : [];

        noteLines.forEach(function (noteItem) {
          const p = document.createElement("p");

          const text =
            noteItem && typeof noteItem.text === "string" ? noteItem.text : "";

          p.textContent = text;

          const className =
            noteItem && typeof noteItem.className === "string"
              ? noteItem.className.trim()
              : "";

          if (className !== "") {
            p.classList.add(className);
          }

          noteTd.appendChild(p);
        });

        return tr;
      };

      //  렌더링: 그룹 단위로 카테고리 1줄 + 그 아래 페이지들
      groups.forEach((group) => {
        const isProgressIncluded = group.includeInProgress !== false;

        tbody.appendChild(createCategoryRow(group.title));

        group.pages.forEach((page) => {
          tbody.appendChild(createPageRow(page, isProgressIncluded));
        });
      });
    </script>
  </body>
</html>
