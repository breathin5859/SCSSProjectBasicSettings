<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- css -->
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/guide.css" />
    <!-- js -->
    <script type="module" src="../js/global.js"></script>
    <title>Style</title>
  </head>
  <body>
    <!-- button -->
    <details name="guide" open>
      <summary>Button</summary>
      <div>
        <h2>Size</h2>
        <button type="button" class="btn sm primary">Sm</button>
        <button type="button" class="btn base primary">Base</button>
        <button type="button" class="btn lg primary">Lg</button>

        <h2>Color</h2>
        <button type="button" class="btn base primary">Base</button>
        <button type="button" class="btn base secondary">secondary</button>

        <h2>Icon</h2>
        <button type="button" class="btn base primary ico1"></button>
      </div>
    </details>
    <!-- form -->
    <details name="guide">
      <summary>Form</summary>
      <div>
        <h2>Check Box</h2>
        <label class="check-wrap">
          <input type="checkbox" class="check-type1" />
          <span class="label">체크박스</span>
        </label>
        <div class="check-group">
          <label class="check-wrap">
            <input type="checkbox" class="check-type1" />
            <span class="label">체크박스</span>
          </label>
        </div>

        <label class="radio-wrap">
          <input type="radio" class="radio-type1" name="nation" />
          <span class="label">내국인</span>
        </label>
      </div>
    </details>
    <!-- badge -->
    <details name="guide" open>
      <summary>Badge</summary>
      <div>
        <h2>Size</h2>
        <button type="button" class="badge sm red">Sm</button>
        <button type="button" class="badge base red">Base</button>

        <h2>Color</h2>
        <button type="button" class="badge base red">Red</button>
      </div>
    </details>
  </body>
  <style></style>
</html>
